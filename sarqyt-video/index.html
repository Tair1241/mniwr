<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Sarqyt demo</title>
<style>
:root{--g:#0F6B4F;--g2:#1E8F63;--mint:#BDEBD3;--cream:#FFF7EA;--ink:#17322A;--orange:#F28C38;--red:#E5484D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:Inter,'DejaVu Sans',sans-serif;color:var(--ink)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--cream)}
.scene{position:absolute;inset:0;overflow:hidden;opacity:0}
.abs{position:absolute}
svg{position:absolute;left:0;top:0}
#sub{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:1500px;padding:14px 30px;border-radius:16px;
 background:rgba(12,28,22,.78);color:#fff;font-size:38px;font-weight:500;line-height:1.3;text-align:center;z-index:100;letter-spacing:.2px}
#sub.left{left:110px;transform:none;max-width:860px;text-align:left;font-size:34px}
#sub:empty{display:none}
.phone{position:absolute;border-radius:64px;background:#0d0f10;padding:16px;box-shadow:0 40px 80px rgba(0,0,0,.35),0 0 0 3px #2b2f33 inset}
.phone .scr{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#fff}
.phone .scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kicker{font-size:28px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--mint)}
.title{font-size:76px;font-weight:800;line-height:1.05;color:#fff;margin-top:14px}
.subt{font-size:36px;font-weight:500;color:#E6F6EE;margin-top:22px;line-height:1.3}
.pill{display:inline-block;padding:12px 26px;border-radius:999px;background:#fff;color:var(--g);font-weight:700;font-size:30px}
.card{position:absolute;background:#fff;border-radius:28px;box-shadow:0 18px 40px rgba(16,50,40,.14)}
.green-bg{background:radial-gradient(1200px 800px at 20% 10%,#1F8A62 0%,#0E5A43 55%,#0A4433 100%)}
.ornament{position:absolute;inset:0;opacity:.08;background-image:radial-gradient(circle at 20px 20px,#fff 2px,transparent 3px);background-size:60px 60px}
.chip{display:flex;align-items:center;gap:18px;font-size:32px;font-weight:600;color:#fff;margin-top:22px;opacity:.35}
.chip b{display:inline-flex;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.15);align-items:center;justify-content:center;font-size:26px}
.chip.on{opacity:1}.chip.on b{background:#fff;color:var(--g)}
</style></head>
<body><div id="stage"><div id="sub"></div></div>
<script src="timeline.js"></script>
<script>
// ---------- helpers ----------
const W=1920,H=1080, stage=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pad=n=>String(n).padStart(5,'0');
const fmt=n=>Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ');
function el(tag,attrs={},parent){const e=document.createElement(tag);for(const k in attrs){if(k==='html')e.innerHTML=attrs[k];else if(k==='style')e.style.cssText=attrs[k];else e.setAttribute(k,attrs[k]);}if(parent)parent.appendChild(e);return e;}
function svgEl(parent,w=W,h=H,inner=''){const d=document.createElement('div');d.innerHTML=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;const s=d.firstChild;parent.appendChild(s);return s;}
const q=(root,sel)=>root.querySelector(sel);
function show(e,o,tx=0,ty=0,s=1){e.style.opacity=o;e.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;}
function pop(e,p,dy=40){const k=eo(p);show(e,k,0,(1-k)*dy,lerp(.96,1,k));}
let PEND=[];
function setImg(img,src){if(img.dataset.src===src)return;img.dataset.src=src;img.src=src;PEND.push(img.decode().catch(()=>{}));}

// ---------- shared art ----------
function skyDefs(id){return `<defs>
<linearGradient id="sky${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FC6E6"/><stop offset=".55" stop-color="#FBE3BC"/><stop offset="1" stop-color="#FFD29A"/></linearGradient>
<radialGradient id="sun${id}"><stop offset="0" stop-color="#FFF4C8"/><stop offset=".45" stop-color="#FFE29A" stop-opacity=".9"/><stop offset="1" stop-color="#FFE29A" stop-opacity="0"/></radialGradient></defs>`;}
function mountains(w,y,color,snow,seed){
  // deterministic jagged range
  let pts=[[0,y+160]],x=0,s=seed;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  const peaks=[];
  while(x<w){const px=x+120+rnd()*160, py=y-rnd()*170; pts.push([px,py]);peaks.push([px,py]);x=px+120+rnd()*150;pts.push([x,y+60+rnd()*60]);}
  pts.push([w,y+160],[w,y+400],[0,y+400]);
  let d='M'+pts.map(p=>p.join(',')).join(' L')+'Z';
  let sn=peaks.map(([px,py])=>{const h=46;return `M${px},${py} L${px-38},${py+h} L${px-14},${py+h-10} L${px},${py+h+4} L${px+16},${py+h-8} L${px+36},${py+h}Z`}).join('');
  return `<path d="${d}" fill="${color}"/><path d="${sn}" fill="${snow}"/>`;
}
function buildings(x0,w,base,seed,palette,minH=120,maxH=330,win='#FFF3DC'){
  let s=seed;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};let out='',x=x0;
  while(x<x0+w){const bw=90+rnd()*120,bh=minH+rnd()*(maxH-minH),c=palette[Math.floor(rnd()*palette.length)];
    out+=`<rect x="${x}" y="${base-bh}" width="${bw}" height="${bh}" fill="${c}" rx="4"/>`;
    for(let wy=base-bh+22;wy<base-30;wy+=38)for(let wx=x+16;wx<x+bw-24;wx+=30)out+=`<rect x="${wx}" y="${wy}" width="14" height="20" rx="2" fill="${win}" opacity="${.55+rnd()*.4}"/>`;
    x+=bw+6+rnd()*10;}
  return out;}
function tree(x,y,s=1,c='#5FA873'){return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-7" y="-70" width="14" height="70" fill="#7A5638"/><circle cx="0" cy="-100" r="52" fill="${c}"/><circle cx="-34" cy="-78" r="34" fill="${c}"/><circle cx="34" cy="-80" r="36" fill="${c}"/></g>`;}
function cityBG(id,{w=W,ground=860,sunX=1480}={}){
  return skyDefs(id)+`<rect width="${w}" height="${H}" fill="url(#sky${id})"/>
  <circle cx="${sunX}" cy="250" r="230" fill="url(#sun${id})"/><circle cx="${sunX}" cy="250" r="74" fill="#FFF0B8"/>
  <g opacity=".95">${mountains(w,430,'#A6B3D8','#FFFFFF',7)}</g>
  <g>${mountains(w,520,'#8293C4','#F3F6FF',19)}</g>
  <g>${buildings(-20,w+40,ground-40,3,['#E8CDB0','#DDBB98','#CFA889','#E9D6BF'],140,360)}</g>
  <rect x="0" y="${ground-40}" width="${w}" height="${H}" fill="#D9CBB6"/>`;
}
// Arman: front-ish flat character, feet at (0,0)
function armanSVG(id){return `<g id="${id}">
 <g class="legL"><rect x="-30" y="-118" width="26" height="114" rx="12" fill="#2B3A55"/><ellipse cx="-20" cy="-2" rx="22" ry="11" fill="#1d1f24"/></g>
 <g class="legR"><rect x="4" y="-118" width="26" height="114" rx="12" fill="#2B3A55"/><ellipse cx="20" cy="-2" rx="22" ry="11" fill="#1d1f24"/></g>
 <g class="armL"><rect x="-62" y="-250" width="24" height="122" rx="12" fill="#E07A2A"/><circle cx="-50" cy="-126" r="13" fill="#E3AC80"/></g>
 <rect x="-48" y="-262" width="96" height="156" rx="30" fill="#F28C38"/>
 <path d="M-20,-262 Q0,-232 20,-262" fill="none" stroke="#C9661F" stroke-width="5"/>
 <rect x="-36" y="-262" width="9" height="120" rx="4" fill="#2F6E58"/><rect x="27" y="-262" width="9" height="120" rx="4" fill="#2F6E58"/>
 <g class="belly" opacity="0"><path d="M-74,-170 q-12,-10 0,-20 q12,-10 0,-20" stroke="#8B5E3C" stroke-width="5" fill="none"/><path d="M74,-170 q12,-10 0,-20 q-12,-10 0,-20" stroke="#8B5E3C" stroke-width="5" fill="none"/></g>
 <g class="armR"><rect x="38" y="-250" width="24" height="122" rx="12" fill="#E07A2A"/><circle cx="50" cy="-126" r="13" fill="#E3AC80"/></g>
 <rect x="-10" y="-282" width="20" height="24" fill="#E3AC80"/>
 <g class="head"><circle cx="0" cy="-318" r="44" fill="#E9B48A"/>
  <path d="M-46,-322 Q-48,-372 0,-372 Q46,-372 46,-322 Q30,-346 0,-344 Q-26,-346 -46,-322Z" fill="#2A1E1A"/>
  <circle cx="-44" cy="-314" r="9" fill="#E3AC80"/><circle cx="44" cy="-314" r="9" fill="#E3AC80"/>
  <g class="brows"><rect x="-26" y="-334" width="16" height="4" rx="2" fill="#2A1E1A"/><rect x="10" y="-334" width="16" height="4" rx="2" fill="#2A1E1A"/></g>
  <circle cx="-17" cy="-318" r="5" fill="#2A1E1A"/><circle cx="17" cy="-318" r="5" fill="#2A1E1A"/>
  <path class="mouth" d="M-14,-294 Q0,-284 14,-294" stroke="#7A3E2A" stroke-width="5" fill="none" stroke-linecap="round"/>
 </g></g>`;}
const MOUTH={smile:'M-15,-296 Q0,-280 15,-296',neutral:'M-12,-292 L12,-292',frown:'M-13,-286 Q0,-298 13,-286',open:'M-14,-298 Q0,-276 14,-298 Z'};
function arman(root,id){const g=q(root,'#'+id);return{g,
  pose({x,y,s=1,walk=null,mood='neutral',flip=1,arm=0,brow=0,belly=0}){
    g.setAttribute('transform',`translate(${x},${y}) scale(${s*flip},${s})`);
    let a=0,b=0;if(walk!==null){a=Math.sin(walk*Math.PI*2)*20;b=Math.abs(Math.cos(walk*Math.PI*2))*6;}
    q(g,'.legL').setAttribute('transform',`rotate(${a} -17 -118)`);q(g,'.legR').setAttribute('transform',`rotate(${-a} 17 -118)`);
    q(g,'.armL').setAttribute('transform',`rotate(${-a*.8} -50 -244)`);q(g,'.armR').setAttribute('transform',`rotate(${a*.8+arm} 50 -244)`);
    q(g,'.head').setAttribute('transform',`translate(0,${-b})`);
    q(g,'.mouth').setAttribute('d',MOUTH[mood]);q(g,'.mouth').setAttribute('fill',mood==='open'?'#7A3E2A':'none');
    q(g,'.brows').setAttribute('transform',`translate(0,${brow})`);q(g,'.belly').setAttribute('opacity',belly);
  }};}
function croissant(x,y,s=1,c='#E2A04A'){const seg=[[-44,6,-62,13,17],[-25,-14,-32,18,23],[0,-22,0,22,27],[25,-14,32,18,23],[44,6,62,13,17]];
  return `<g transform="translate(${x},${y}) scale(${s})">${seg.map(([cx,cy,r,rx,ry])=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${r} ${cx} ${cy})" fill="${c}" stroke="#B9772C" stroke-width="3"/>`).join('')}<path d="M-14,-30 q-3,10 0,18 M14,-30 q3,10 0,18" stroke="#F3C27A" stroke-width="4" fill="none" stroke-linecap="round"/></g>`;}
function donut(x,y,s=1,ic='#F6A5C0'){return `<g transform="translate(${x},${y}) scale(${s})"><circle r="40" fill="#D9984F"/><path d="M-36,-6 Q-30,-36 0,-38 Q32,-36 37,-4 Q30,8 20,2 Q8,12 -4,4 Q-18,12 -28,4Z" fill="${ic}"/><circle r="13" fill="#FFF7EA"/><g stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M-20,-22 l6,3"/><path d="M8,-28 l5,-3"/><path d="M22,-12 l4,4"/></g></g>`;}
function qrSVG(x,y,size){let s=11,o='',r=7;const cell=size/21;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  for(let i=0;i<21;i++)for(let j=0;j<21;j++){const f=(i<7&&j<7)||(i<7&&j>13)||(i>13&&j<7);if(f)continue;if(rnd()>.52)o+=`<rect x="${x+i*cell}" y="${y+j*cell}" width="${cell}" height="${cell}"/>`;}
  const fp=(fx,fy)=>`<rect x="${x+fx*cell}" y="${y+fy*cell}" width="${7*cell}" height="${7*cell}"/><rect x="${x+(fx+1)*cell}" y="${y+(fy+1)*cell}" width="${5*cell}" height="${5*cell}" fill="#fff"/><rect x="${x+(fx+2)*cell}" y="${y+(fy+2)*cell}" width="${3*cell}" height="${3*cell}"/>`;
  return `<g fill="#111">${o}${fp(0,0)}${fp(14,0)}${fp(0,14)}</g>`;}
function makePhone(parent,{h=900,x=0,y=0}){const w=Math.round((h-32)*1290/2796)+32;const p=el('div',{class:'phone',style:`width:${w}px;height:${h}px;left:${x}px;top:${y}px`},parent);
  const scr=el('div',{class:'scr'},p);const img=el('img',{},scr);return{el:p,scr,img,w,h};}
function playClip(ph,name,n,lt,dur,{start=0,minSpeed=.6,maxSpeed=2.2}={}){
  const avail=Math.max(.1,dur-start);let sp=clamp(n/(avail*30),minSpeed,maxSpeed);
  const f=clamp(Math.floor((lt-start)*30*sp),0,n-1);setImg(ph.img,`clips/${name}/${pad(f+1)}.jpg`);return f;}
function greenPanel(sc,{kicker,title,sub,chips=[]}){
  sc.el.classList.add('green-bg');el('div',{class:'ornament'},sc.el);
  const box=el('div',{class:'abs',style:'left:110px;top:150px;width:860px'},sc.el);
  const k=el('div',{class:'kicker',html:kicker},box),t=el('div',{class:'title',html:title},box),s=el('div',{class:'subt',html:sub},box);
  const cs=chips.map((c,i)=>el('div',{class:'chip',html:`<b>${i+1}</b>${c}`},box));return{k,t,s,cs,box};}

// ---------- scenes ----------
const SC={};
SC.almaty={init(sc){
  const s=svgEl(sc.el,W,H,`<g id="cam">${cityBG('a')}
   <g transform="translate(120,0)"><rect x="80" y="420" width="640" height="420" fill="#F1E3CF"/><polygon points="60,430 400,300 740,430" fill="#C9A27E"/>
    <rect x="70" y="420" width="660" height="26" fill="#B48C68"/>${[0,1,2,3,4,5].map(i=>`<rect x="${120+i*108}" y="470" width="34" height="330" fill="#FFFFFF" opacity=".9"/>`).join('')}
    <rect x="330" y="640" width="140" height="200" rx="8" fill="#6B4A33"/><rect x="398" y="640" width="4" height="200" fill="#4c3322"/>
    <rect x="250" y="360" width="300" height="44" rx="8" fill="#0F6B4F"/><text x="400" y="391" text-anchor="middle" font-size="26" font-weight="700" fill="#fff" letter-spacing="3">УНИВЕРСИТЕТ</text></g>
   ${tree(1040,860,1.1)}${tree(1700,860,1.25,'#4E9966')}${tree(60,860,1.2,'#4E9966')}
   <rect x="0" y="900" width="${W}" height="180" fill="#C8B9A2"/>
   ${armanSVG('arm')}</g>`);
  sc.cam=q(s,'#cam');sc.a=arman(s,'arm');
  sc.lbl=el('div',{class:'abs',style:'left:90px;top:80px',html:`<div class="pill" style="font-size:40px;padding:16px 34px;box-shadow:0 10px 30px rgba(0,0,0,.12)">Алматы, 14:30</div>`},sc.el);
  sc.bub=el('div',{class:'abs',style:'left:0;top:0;font-size:44px;font-weight:800;color:#8B5E3C;font-style:italic',html:'урр-р-р…'},sc.el);
},update(sc,t,d){
  const z=lerp(1.12,1.0,eio(seg(t,0,d)));sc.cam.setAttribute('transform',`translate(${W/2},${H/2}) scale(${z}) translate(${-W/2+lerp(-40,30,t/d)},${-H/2})`);
  pop(sc.lbl,seg(t,.3,1.1));
  const wp=seg(t,1.6,d-.3);const x=lerp(520,980,wp);const growl=seg(t,d*.62,d*.7)*(1-seg(t,d-.4,d));
  sc.a.pose({x,y:900,s:1.05,walk:wp>0&&wp<1?t*1.6:null,mood:growl>0?'frown':'neutral',belly:growl,brow:growl*3});
  sc.a.g.style.opacity=seg(t,1.2,1.7);
  sc.bub.style.left=(x*z+80)+'px';sc.bub.style.top='400px';sc.bub.style.opacity=growl;sc.bub.style.transform=`rotate(-6deg) scale(${.8+.2*growl})`;
}};
SC.street={init(sc){
  const s=svgEl(sc.el,W,H,`${skyDefs('s')}<rect width="${W}" height="${H}" fill="url(#skys)"/>
   <g id="far">${mountains(5200,470,'#A6B3D8','#fff',5)}</g>
   <g id="mid">${buildings(0,5200,820,11,['#E8CDB0','#D7B08E','#EBD9C3','#C99F80'],260,520)}</g>
   <rect x="0" y="820" width="${W}" height="260" fill="#CDBFAA"/><rect x="0" y="960" width="${W}" height="120" fill="#6E6A6A"/><g id="dash"></g>
   <g id="near">${[0,1,2,3,4,5,6,7].map(i=>tree(200+i*620,840,1,i%2?'#5FA873':'#4E9966')).join('')}</g>
   <g id="cafe"><rect x="0" y="380" width="620" height="450" fill="#F4EBDD"/><rect x="0" y="380" width="620" height="70" fill="#0F6B4F"/>
     <text x="310" y="430" text-anchor="middle" font-size="46" font-weight="800" fill="#fff" letter-spacing="6">КАФЕ</text>
     <path d="M0,450 h620 v34 q-31,22 -62,0 q-31,22 -62,0 q-31,22 -62,0 q-31,22 -62,0 q-31,22 -62,0 q-31,22 -62,0 q-31,22 -62,0 q-31,22 -62,0 q-31,22 -62,0 q-31,22 -62,0Z" fill="#F28C38"/>
     <rect x="40" y="530" width="330" height="240" rx="10" fill="#BFE3F0"/>${croissant(120,700,1)}${croissant(230,690,.9)}${croissant(300,720,.8)}
     <rect x="420" y="560" width="150" height="270" rx="6" fill="#6B4A33"/>
     <g transform="translate(700,470)"><rect x="-8" y="0" width="16" height="360" fill="#555"/><circle cx="0" cy="-30" r="54" fill="#E5484D"/><text x="0" y="-8" text-anchor="middle" font-size="64" font-weight="900" fill="#fff">M</text></g></g>
   <g id="scoot"><g transform="scale(-1,1)"><circle cx="-60" cy="0" r="22" fill="#222"/><circle cx="60" cy="0" r="22" fill="#222"/><rect x="-70" y="-14" width="140" height="12" rx="6" fill="#0F6B4F"/><rect x="52" y="-130" width="10" height="120" fill="#333"/><rect x="40" y="-134" width="40" height="8" rx="4" fill="#333"/>
    <rect x="-12" y="-120" width="22" height="108" rx="10" fill="#334"/><rect x="-26" y="-210" width="50" height="96" rx="20" fill="#5B7FD1"/><circle cx="0" cy="-236" r="26" fill="#C98E64"/><path d="M-28,-240 Q0,-282 28,-240Z" fill="#E5484D"/></g></g>
   <g id="smell" opacity="0"><path d="M0,0 q20,-30 0,-60 q-20,-30 0,-60" stroke="#C9A27E" stroke-width="6" fill="none" opacity=".8"/><path d="M40,10 q20,-30 0,-60 q-20,-30 0,-60" stroke="#C9A27E" stroke-width="6" fill="none" opacity=".6"/></g>
   ${armanSVG('arm2')}`);
  sc.s=s;sc.a=arman(s,'arm2');sc.far=q(s,'#far');sc.mid=q(s,'#mid');sc.near=q(s,'#near');sc.cafe=q(s,'#cafe');sc.scoot=q(s,'#scoot');sc.smell=q(s,'#smell');sc.dash=q(s,'#dash');
  sc.dash.innerHTML=[...Array(30)].map((_,i)=>`<rect x="${i*160}" y="1016" width="80" height="10" fill="#fff" opacity=".7"/>`).join('');
  sc.wal=el('div',{class:'card',style:'left:0;top:0;width:330px;padding:24px 28px;font-size:30px;font-weight:700',html:`<svg width="280" height="120" viewBox="0 0 280 120" style="position:static"><rect x="10" y="20" width="170" height="96" rx="16" fill="#8B5E3C"/><rect x="120" y="50" width="70" height="40" rx="10" fill="#6E4A2F"/><circle cx="215" cy="92" r="20" fill="#E8C35A"/><circle cx="246" cy="78" r="16" fill="#D9B24A"/><circle cx="232" cy="104" r="13" fill="#E8C35A"/></svg><div style="margin-top:6px">В кошельке — мелочь</div>`},sc.el);
},update(sc,t,d){
  const stop=seg(t,d*.62,d*.95);const v=lerp(1,0,eo(stop));const p=t*(1-stop*.5);
  const travel=Math.min(t,d*.62)+ (t>d*.62? (d*.33)*eo(stop)*.5:0);
  sc.far.setAttribute('transform',`translate(${-travel*20},0)`);sc.mid.setAttribute('transform',`translate(${-travel*90},0)`);
  sc.near.setAttribute('transform',`translate(${-travel*240},0)`);sc.dash.setAttribute('transform',`translate(${-(travel*240)%160},0)`);
  const cx=lerp(2100,1100,eo(seg(t,d*.45,d*.95)));sc.cafe.setAttribute('transform',`translate(${cx},0)`);
  sc.smell.setAttribute('transform',`translate(${cx+200},520)`);sc.smell.setAttribute('opacity',seg(t,d*.7,d*.85)*.9);
  const ax=lerp(760,960,eo(stop));
